<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>React Syllabus Checklist</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="A friendly, example-driven React syllabus covering the core concepts you need before starting React Native.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Docsify theme (Vue style) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- Nicer code font/highlighting tweaks -->
  <style>
    :root {
      --theme-color: #5b2d91;
    }
    .markdown-section code {
      border-radius: 4px;
    }
    .markdown-section pre > code {
      border-radius: 6px;
    }
    .app-name-link img {
      height: 28px;
    }
    .sidebar-nav > ul > li > a {
      font-weight: 600;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
    }
  </style>
</head>
<body>
  <div id="app">Loading React Syllabus Checklist...</div>
  <script>
    window.$docsify = {
      name: 'React Syllabus Checklist',
      // Replace with your own repo once you push this to GitHub, e.g.
      // 'https://github.com/your-username/ReactSyllabus'
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 2,
      auto2top: true,
      coverpage: true,
      onlyCover: false,
      homepage: 'README.md',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search the syllabus...',
        noData: 'No results found.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      },
      count: {
        countable: true,
        position: 'top'
      }
    }
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.js"></script>

  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-jsx.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
